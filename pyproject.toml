[project]
name = "bpd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rebecca Matos", email = "beccamatos@gmail.com" }
]
requires-python = ">=3.11.3"
dependencies = [
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
]

[project.scripts]
bpd = "bpd:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
